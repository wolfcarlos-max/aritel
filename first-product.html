<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
<div class="page-header">
    <h1>SHOP</h1>
    <p>Drop by and see what's new!</p>
</div>



<section>
    <h2 class="page-subheading">Product Collection</h2>
</section>



<!-- ==================================
        MAIN PRODUCT SECTION
=================================== -->

<section class="product-container">

    <!-- PRODUCT IMAGE -->
    <div class="product-image">
        <img src="images/product-shirt.jpg" alt="Don't Be Late Tee">
    </div>


    <!-- PRODUCT DETAILS -->
    <div class="product-details">

        <!-- PRODUCT NAME -->
        <h1>Don't Be Late Tee</h1>

        <!-- PRICE AND SIZE CHART -->
        <a href="#" class="size-chart">Size Chart</a>
        <p class="product-price">₱ 499</p>


        <!-- COLOR OPTIONS -->
        <div class="color-options">
            <div class="color-circle color-red"></div>
            <div class="color-circle color-black"></div>
            <div class="color-circle color-beige"></div>
        </div>


        <!-- SIZE SELECTION -->
        <label>Select size:</label>

        <div class="size-options">
            <button type="button">S</button>
            <button type="button">M</button>
            <button type="button">L</button>
        </div>


        <!-- QUANTITY SELECTION -->
        <label>Quantity:</label>

        <div class="quantity-options">
            <button type="button">-</button>
            <button type="button">1</button>
            <button type="button">+</button>
        </div>


        <!-- PRODUCT ACTION BUTTONS -->
        <div class="product-buttons">
            <button type="button">Add to Cart</button>
            <button type="button">Buy Now</button>
        </div>

    </div>

</section>


</div>  
</body>
</html>
